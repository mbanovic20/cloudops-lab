apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mbanovic20/cloudops-lab.git
    targetRevision: main
    path: helm/cloudops-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true