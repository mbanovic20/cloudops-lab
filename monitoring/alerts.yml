groups:
  - name: cloudops-lab-alerts
    rules:
      - alert: CloudOpsAppDown
        expr: up{job="cloudops-lab"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CloudOps Lab application is down"
          description: "Prometheus cannot scrape the application metrics endpoint."

      - alert: HighHttpErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP requests are returning server errors."