services:
  app:
    build: .
    image: cloudops-lab:local
    container_name: cloudops-lab
    ports:
      - "8000:8000"
    environment:
      ENABLE_TEST_ENDPOINTS: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: cloudops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: cloudops-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    depends_on:
      - alert-logger
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: cloudops-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

  alert-logger:
    image: python:3.14-slim
    container_name: cloudops-alert-logger
    command: ["python", "/app/webhook_logger.py"]
    volumes:
      - ./monitoring/webhook_logger.py:/app/webhook_logger.py:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: cloudops-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
