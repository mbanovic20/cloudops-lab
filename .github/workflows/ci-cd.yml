name: CloudOps Lab CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Helm chart
        run: docker run --rm -v "$PWD/helm:/charts:ro" alpine/helm:4.3.0 lint /charts/cloudops-lab

      - name: Check Prometheus config and alert rules
        run: >
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.15.0
          check config /etc/prometheus/prometheus.yml

      - name: Check Alertmanager config
        run: >
          docker run --rm -v "$PWD/monitoring:/cfg:ro"
          --entrypoint amtool prom/alertmanager:v0.34.1
          check-config /cfg/alertmanager.yml

      - name: Validate Terraform
        run: |
          tf() { docker run --rm -v "$PWD/terraform:/tf" -w /tf hashicorp/terraform:1.16.5 "$@"; }
          tf fmt -check -recursive
          tf init -backend=false -input=false
          tf validate

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t cloudops-lab:ci .

  publish:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
